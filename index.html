<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản Lý Users</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ================= MÀN HÌNH ĐĂNG NHẬP ================= -->
  <div id="loginScreen" class="login-container" style="display: none;">
    <div class="login-box">
      <h2>🔐 Cấp Quyền Truy Cập</h2>
      <p style="margin-bottom: 20px; color: #718096; font-size: 0.9rem;">Chọn thời hạn để tạo Key tự động.</p>
      
      <div class="form-group" style="margin-bottom: 15px;">
        <label>Thời hạn sử dụng</label>
        <select id="durationSelect" class="input-field">
          <option value="1d">1 Ngày</option>
          <option value="2d">2 Ngày</option>
          <option value="1m" selected>1 Tháng</option>
          <option value="3m">3 Tháng</option>
          <option value="5m">5 Tháng</option>
        </select>
      </div>

      <div class="form-group" style="margin-bottom: 25px;">
        <label>Key của bạn (Tự động điền)</label>
        <input type="text" id="loginKeyInput" class="input-field" placeholder="Bấm tạo Key bên dưới" />
      </div>

      <button id="generateKeyBtn" class="btn btn-secondary" style="width: 100%; margin-bottom: 10px; background:#fef3c7; color:#92400e;">📅 Tạo Key Ngay</button>
      <button id="loginBtn" class="btn btn-primary" style="width: 100%;">Đăng Nhập</button>
    </div>
  </div>

  <!-- ================= GIAO DIỆN CHÍNH ================= -->
  <div class="container" id="mainApp" style="display: none;">
    <header class="header">
      <h1>👥 Quản Lý Users</h1>
      <div style="display: flex; gap: 10px; align-items: center;">
        <div class="status" id="status">
          <span class="dot"></span>
          <span id="statusText">Online</span>
        </div>
        <button id="logoutBtn" class="btn btn-secondary" style="padding: 8px 12px; font-size: 0.9rem;">Đăng xuất</button>
      </div>
    </header>

    <!-- Form thêm user -->
    <section class="card">
      <h2>➕ Thêm User Mới (Upload Nhanh)</h2>
      <form id="userForm" class="form">
        <div class="form-group">
          <label for="name">Tên</label>
          <input type="text" id="name" class="input-field" placeholder="Nguyen Van A" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="input-field" placeholder="a@example.com" required />
        </div>
        <button type="submit" id="submitBtn" class="btn btn-primary">
          Thêm User
        </button>
      </form>
    </section>

    <!-- Danh sách users -->
    <section class="card">
      <div class="card-header">
        <h2>📋 Danh Sách Users</h2>
        <button id="refreshBtn" class="btn btn-secondary">🔄 Làm mới</button>
      </div>
      <div id="userList" class="user-list">
        <p class="loading">Đang tải dữ liệu...</p>
      </div>
    </section>

    <div id="toast" class="toast"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
