<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản Lý Users</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>👥 Quản Lý Users</h1>
      <div class="status" id="status">
        <span class="dot"></span>
        <span id="statusText">Đang kiểm tra...</span>
      </div>
    </header>

    <!-- Form thêm user -->
    <section class="card">
      <h2>➕ Thêm User Mới</h2>
      <form id="userForm" class="form">
        <div class="form-group">
          <label for="name">Tên</label>
          <input type="text" id="name" placeholder="Nguyen Van A" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="a@example.com" required />
        </div>
        <button type="submit" class="btn btn-primary">
          Thêm User
        </button>
      </form>
    </section>

    <!-- Danh sách users -->
    <section class="card">
      <div class="card-header">
        <h2>📋 Danh Sách Users</h2>
        <button id="refreshBtn" class="btn btn-secondary">🔄 Làm mới</button>
      </div>
      <div id="userList" class="user-list">
        <p class="loading">Đang tải dữ liệu...</p>
      </div>
    </section>

    <!-- Toast thông báo -->
    <div id="toast" class="toast"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
